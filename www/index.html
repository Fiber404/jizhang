<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4D6BFE">
  <meta name="description" content="一只小账本陪你一起记账，简单可爱的个人记账本">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="金币记账本">
  <title>金币记账本</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar" class="topbar"></header>
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar">
      <button class="tab" data-action="tab" data-tab="today">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
        </span>
        <span class="tab-label">今日</span>
      </button>
      <button class="tab" data-action="tab" data-tab="detail">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 3v3.5M16 3v3.5"/></svg>
        </span>
        <span class="tab-label">明细</span>
      </button>
      <button class="tab" data-action="tab" data-tab="add">
        <span class="tab-icon tab-icon--add">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </span>
        <span class="tab-label">记一笔</span>
      </button>
      <button class="tab" data-action="tab" data-tab="chart">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12A9 9 0 1 1 12 3v9z" fill="currentColor" stroke="none" opacity="0.35"/><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor"/><path d="M12 3v9h9" fill="none" stroke="currentColor"/></svg>
        </span>
        <span class="tab-label">图表</span>
      </button>
      <button class="tab" data-action="tab" data-tab="mine">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"/></svg>
        </span>
        <span class="tab-label">我的</span>
      </button>
    </nav>
  </div>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
